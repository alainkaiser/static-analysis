name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The min-release-age cooldown in .npmrc needs a current npm 11.
      - run: npm install --global 'npm@^11.17.0'
      - run: npm ci
      - run: npm run check
